schema: intent-driven-with-human-control
stack: javascript

context: |
  Tech stack: Bun 1.4.2, Elysia, `bun test`. Outer acceptance tests drive the real app in a
  browser with Playwright. Everything else arrives in the step whose test needs it.
  Domain: TodoMVC (https://github.com/tastejs/todomvc/blob/master/app-spec.md), one feature per step.

#     Use senior-dev sub-agent for all src related work and senior-qa for acceptance tests.
#     Do not optimize the batch the tasks for senior-dev and senior-qa, call them as many times as necessary in smaller batches as dev and qa work may be interleaved.

rules:
  proposal:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    # - Must use adversarial-authoring skill
    # - Must use glossary skill
  design:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    - Must use c4-diagrams skill - Mermaid, lightweight C4-inspired; do not ask
    # - Must use glossary skill
  adr:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    - Must use architectural-decision-records skill
  specs:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    # - Must use spec-as-source skill
  tasks:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    # - Must use spec-as-source skill

operations:
  apply:
    guidance:
      - Must use test-driven-development skill
      - Must use outside-in-tdd skill - one stop per test, for the human's prediction
  archive:
    guidance:
      - Must run OpenSpec Sync before archiving
